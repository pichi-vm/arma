name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # artifact deps make `cargo metadata` nightly-only, so install the pinned
      # toolchain (from rust-toolchain.toml) before cargo-deny reads the tree.
      - run: rustup show
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the pinned nightly + components + targets
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  # Independent of the OS matrix: packaging-only flakes must not burn
  # ubuntu/macos/windows runners. Copr runs this Makefile as root with
  # dnf; here we install the same tools via apt + rustup and pass
  # DNF=true so the recipe skips dnf on Ubuntu.
  copr-srpm:
    name: copr srpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install rpmbuild tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils gzip
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build SRPM
        run: |
          set -euo pipefail
          outdir=$(mktemp -d)
          make -f .copr/Makefile srpm \
            spec="$PWD/packaging/arma.spec" \
            outdir="$outdir" \
            DNF=true
          shopt -s nullglob
          srpms=("$outdir"/*.src.rpm)
          test "${#srpms[@]}" -eq 1
          echo "built ${srpms[0]}"
          test ! -e vendor

  # Fail fast: the OS matrix waits on Tier-1. A header, deny, commit-message,
  # or lint failure skips ubuntu/macos/windows instead of burning those runners.
  # arma cross-compiles tatu for the host arch's bare-metal target via bindeps,
  # so each OS exercises a different firmware arch: x86_64-unknown-none on Linux
  # and Windows, aarch64-unknown-none-softfloat on Apple-silicon macOS. Windows
  # also guards PE emission on a Windows host (arma's output is a PE). The image
  # tests build real PMIs from real kernels (fetched + cached by burrow).
  test:
    name: build + test (${{ matrix.os }})
    needs: [license-headers, cargo-deny, commit-messages, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
